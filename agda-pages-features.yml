# agda-pages.yml includes the following default list of theme features.
# They are documented at https://jaywhj.github.io/mkdocs-materialx/setup/.
# See also the recommendations in the Agda-Pages User Guide.

theme:
  features:
    - content.code.copy
    # - navigation.expand     # unsuitable for large sites
    # - navigation.footer     # unsuitable for large sites
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    # - navigation.prune    # suppresses effect of navigation.expand
    # - navigation.sections # incompatible with navigation.expand
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate       # incompatible with navigation.indexes
